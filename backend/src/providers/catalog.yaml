- id: opensees-dynamic
  kind: solver
  name:
    zh: OpenSees 动力分析
    en: OpenSees Dynamic Analysis
  description:
    zh: OpenSees
      线弹性模态与一致时间步地震时程分析；显式质量方案、激励方向、阻尼，记录指定节点六分量位移/速度/加速度、构件端力和支座反力。时程运动相对地面；暂不提供任意跨内瞬态响应或通用非线性动力。
    en: OpenSees linear modal and earthquake time-history analysis with explicit
      mass source, direction, damping and time step. Records requested
      six-component nodal motion, member end forces and support reactions.
      Motion is relative to the ground; arbitrary interior transient responses
      and general nonlinear dynamics are unsupported.
  priority: 150
  software: opensees
  analysisType: dynamic
  engineId: builtin-opensees
  adapterKey: builtin-opensees
  supportedAnalysisTypes:
    - dynamic
  supportedModelFamilies:
    - frame
    - truss
    - generic
  aliases: []
  runtimePath: agent-skills/analysis/opensees-dynamic/runtime.py
- id: opensees-nonlinear
  kind: solver
  name:
    zh: OpenSees 非线性分析
    en: OpenSees Nonlinear Analysis
  description:
    zh: 审查结构化非线性输入；完整构件非线性求解尚未实现，明确拒绝执行，不用线弹性或简化模型替代。
    en: Audit structured nonlinear inputs. Full-member nonlinear execution is not implemented and fails explicitly without a linear or reduced-model substitute.
  priority: 160
  software: opensees
  analysisType: nonlinear
  engineId: builtin-opensees
  adapterKey: builtin-opensees
  supportedAnalysisTypes:
