- id: opensees-static
  kind: solver
  name:
    zh: OpenSees 静力分析
    en: OpenSees Static Analysis
  description:
    zh: OpenSees
      二维/三维线弹性杆系静力分析：梁柱、桁架与混合支撑，局部/集中荷载、多工况组合及弯曲端释放。跨内力学恢复与直接节点结果区分；轴向/剪切/扭转释放、刚端偏心和二阶分析尚不支持。
    en: OpenSees 2-D/3-D linear frame statics with beams, columns, trusses, mixed
      braces, partial/point loads, case combinations and bending end releases.
      Interior mechanics recovery is distinct from direct nodal results.
      Axial/shear/torsional releases, rigid offsets and second-order analysis
      are unsupported.
  priority: 140
  software: opensees
  analysisType: static
  engineId: builtin-opensees
  adapterKey: builtin-opensees
  supportedAnalysisTypes:
    - static
  supportedModelFamilies:
    - frame
    - truss
    - generic
  aliases: []
  runtimePath: agent-skills/analysis/opensees-static/runtime.py
- id: pkpm-static
  kind: solver
  name:
    zh: PKPM 静力分析
    en: PKPM Static Analysis
  description:
    zh: PKPM
      线弹性杆系静力分析，逐层保持实际拓扑、显式材料与截面属性；接通节点六分量荷载、多工况、有符号截面结果与线性组合。显式设计请求可使用已验证标准材料和真实截面计算所需配筋或读取原生钢构件校核；普通分析不发布设计结论，缺失结果不补零。
    en: PKPM linear elastic frame statics preserving per-floor topology and explicit
      material/section properties, with six-component nodal loads, multiple
      cases, signed stations and linear combinations. Explicit design requests
      use verified standard materials and physical sections for required
      reinforcement or native steel checks. Ordinary analysis publishes no
      design conclusions; missing results are not zero-filled.
  priority: 130
  software: pkpm
  analysisType: static
  engineId: builtin-pkpm
  adapterKey: builtin-pkpm
  supportedAnalysisTypes:
    - static
  supportedModelFamilies:
    - frame
    - generic
  aliases: []
  runtimePath: agent-skills/analysis/pkpm-static/runtime.py
- id: yjk-static
  kind: solver
  name:
    zh: YJK 静力分析
    en: YJK Static Analysis
  description:
    zh: YJK
      三维杆系静力分析及原生框架设计。分析保留物理构件、荷载位置与源工况，支持普通竖柱固定、铰支、方向支座及梁端成对局部弯曲释放，保留扭转；普通梁柱自重绑定源密度、面积及明确工况。显式设计请求读取混凝土矩形梁柱配筋及钢
      H/箱形梁柱应力验算，核对真实几何、材料牌号、规范和原生组合。缺项不填零，参考截面不用于设计。
    en: YJK 3-D frame statics and native frame design. Analysis preserves physical
      members, load positions and source cases, with fixed/pinned/directional
      vertical-column bases and paired local beam bending releases retaining
      torsion; ordinary beam/column weight binds authored density and area to an
      explicit case. Explicit design requests read concrete rectangular-member
      reinforcement or steel I/box stress checks with physical geometry, grade,
      code and native combinations verified. Missing values never become zero
      and reference sections cannot be designed.
  priority: 125
  software: yjk
  analysisType: static
  engineId: builtin-yjk
  adapterKey: builtin-yjk
  supportedAnalysisTypes:
    - static
  supportedModelFamilies:
    - frame
    - generic
  aliases: []
  runtimePath: agent-skills/analysis/yjk-static/runtime.py
