id: pkpm-static
domain: analysis
source: builtin
name:
  zh: PKPM 静力分析
  en: PKPM Static Analysis
description:
  zh: PKPM 线弹性杆系静力分析，逐层保持实际拓扑、显式材料与截面属性；接通节点六分量荷载、多工况、有符号截面结果与线性组合。显式设计请求可使用已验证标准材料和真实截面计算所需配筋或读取原生钢构件校核；普通分析不发布设计结论，缺失结果不补零。
  en: PKPM linear elastic frame statics preserving per-floor topology and explicit material/section properties, with six-component nodal loads, multiple cases, signed stations and linear combinations. Explicit design requests use verified standard materials and physical sections for required reinforcement or native steel checks. Ordinary analysis publishes no design conclusions; missing results are not zero-filled.
