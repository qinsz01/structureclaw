  en: PKPM Static Analysis
description:
  zh: PKPM 线弹性杆系静力分析，逐层保持实际拓扑、显式材料与截面属性；已接通节点六自由度荷载、全跨竖向均布荷载、多工况与线性组合，以及有符号截面内力和节点六分量结果。执行前核对原生能力，验收范围以冻结算例记录为准。
  en: PKPM linear elastic frame statics preserving per-floor topology and explicit material/section properties. Supports six-component nodal loads, full-span vertical uniform loads, multiple cases and linear combinations, signed section forces and six-component nodal results. Native capabilities are checked before execution; certification follows frozen case records.
