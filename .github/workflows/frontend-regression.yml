name: Frontend Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/src/runtime/**'
      - 'backend/src/types/conversation-runtime.ts'
      - 'backend/src/shared/legacy-capabilities.ts'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/frontend-regression.yml'
  push:
    branches:
      - master
      - work/research-next
    paths:
      - 'frontend/**'
      - 'backend/src/runtime/**'
      - 'backend/src/types/conversation-runtime.ts'
      - 'backend/src/shared/legacy-capabilities.ts'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/frontend-regression.yml'

permissions:
  contents: read

jobs:
  frontend-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Canonical run-policy types are inferred from the backend's Zod schema.
      # Type checking needs its dependencies, but no native builds or backend startup.
      - name: Install backend dependencies for shared types
        run: npm ci --prefix backend --ignore-scripts

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Frontend type-check
        run: npm run type-check --prefix frontend

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend unit tests
        run: npm run test:run --prefix frontend
